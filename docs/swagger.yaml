      is_active:
        example: true
        type: boolean
      meta:
        $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.ResponseMeta'
      name:
        example: Wireless Headphones
        type: string
      price:
        example: 99.99
        type: number
      sku:
        example: WH-1000XM4
        type: string
      stock:
        example: 100
        type: integer
