  github_com_oojoseph67_ecommerce_internal_dto.ResponseMeta:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  github_com_oojoseph67_ecommerce_internal_dto.SignupRequest:
    properties:
      email:
        example: user@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: User123!
        type: string
      phone:
        example: "+1234567890"
        type: string
    required:
    - email
