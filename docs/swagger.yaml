      subtotal:
        example: 199.98
        type: number
    type: object
  github_com_oojoseph67_ecommerce_internal_dto.CartResponse:
    properties:
      cart_item:
        items:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CartItemResponse'
