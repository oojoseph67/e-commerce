host: localhost:1234
info:
  contact:
    email: oojoseph67@gmail.com
    name: Joseph
    url: https://josephbuilds.xyz
  description: A modern e-commerce API built with Go, Gin, and GORM
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: E-Commerce API
  version: "1"
paths:
  /auth/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin account
      parameters:
      - description: Admin login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: Admin login
      tags:
      - Auth
  /auth/admin/signup:
    post:
      consumes:
      - application/json
      description: Register a new admin account with a valid admin code
      parameters:
      - description: Admin signup credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AdminSignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: Admin registration
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user account
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the refresh token
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: User logout
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: Refresh access token
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: User signup credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      summary: User registration
      tags:
      - Auth
  /cart/:
    get:
      consumes:
      - application/json
      description: Retrieve the authenticated user's shopping cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CartResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Get user cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the authenticated user's shopping cart
      parameters:
      - description: Product to add to cart
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.AddToCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CartResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{id}:
    delete:
      consumes:
      - application/json
      description: Remove an item from the shopping cart
      parameters:
      - description: Cart Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      description: Update the quantity of an item in the shopping cart
      parameters:
      - description: Cart Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CartItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /categories/:
    get:
      consumes:
      - application/json
      description: Retrieve all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.GetCategoriesResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Get all categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new product category (admin only)
      parameters:
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.CategoryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - Categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a product category (admin only)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_utils_responses.Response'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Update an existing product category (admin only)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oojoseph67_ecommerce_internal_dto.UpdateCategoryRequest'
      produces:
      - application/json
