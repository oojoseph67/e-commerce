<!doctype html>
<html>
	<head>
		<title>E-Commerce API Documentation</title>
		<meta charset="utf-8" />
		<script
			type="module"
			src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"
		></script>
		<style>
			body {
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
	<body>
		<!--        server-url="http://localhost:8880"-->
		<rapi-doc
			spec-url="/docs/doc.json"
			theme="dark"
			bg-color="#1a1a2e"
			text-color="#e0e0e0"
			header-color="#2d3748"
			primary-color="#3182ce"
			nav-bg-color="#2d3748"
			nav-text-color="#ffffff"
			nav-hover-bg-color="#4a5568"
			nav-hover-text-color="#ffffff"
			nav-accent-color="#3182ce"
			render-style="focused"
			schema-style="table"
			default-schema-tab="schema"
			show-header="true"
			show-info="true"
			allow-authentication="true"
			allow-server-selection="true"
			allow-advanced-list-style-selection="false"
			show-components="true"
			sort-tags="true"
			goto-path=""
			fill-request-fields-with-example="true"
			persist-auth="true"
			use-path-in-nav-bar="false"
		>
			<div
				slot="logo"
				style="display: flex; align-items: center; gap: 10px"
			>
				<div
					style="
						margin-left: 7px;
						font-size: 18px;
						font-weight: 700;
						color: #3182ce;
					"
				>
					E-Commerce API
				</div>
			</div>
		</rapi-doc>
	</body>
</html>
