services:
  postgres:
    image: postgres:12-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: go-ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cdn:
    image: nginx:alpine
    container_name: nginx_container
    ports:
      - "1235:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../uploads:/var/www/ecommerce-uploads
    depends_on:
      - localstack

  localstack:
    image: localstack/localstack:3.7
    container_name: localstack_container
    environment:
      SERVICES: s3,sqs,lambda,apigateway,dynamodb
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"

volumes:
  postgres_data:
